name: Checks
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build and smoke-test the Docker image without publishing
        run: |
          docker build -t leafdock:ci .
          docker run -d --name leafdock-ci -p 127.0.0.1:3000:3000 leafdock:ci
          trap 'docker logs leafdock-ci; docker stop leafdock-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              curl --fail --silent http://127.0.0.1:3000/demo.html > /dev/null
              curl --fail --silent http://127.0.0.1:3000/THIRD_PARTY_NOTICES.txt > /dev/null
              exit 0
            fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
